# Netlify → praises.team build contract.
# GitHub pushes → Netlify runs this → praises.team updates.

[build]
  command = "npm install && npx vite build --outDir dist --emptyOutDir"
  publish = "dist"

# SPA: every route serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
